spring.application.name=demo
server.port=8080

# ---------- Banco de dados (MySQL) ----------
# createDatabaseIfNotExist=true: o banco é criado sozinho na primeira execução.
# Para mudar usuário/senha sem mexer no código, defina as variáveis DB_URL, DB_USER e DB_PASS.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/login_page?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# ---------- JPA ----------
# update: cria/atualiza as tabelas a partir das @Entity automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Usuário administrador criado na primeira execução (se não existir) ----------
app.admin.email=${ADMIN_EMAIL:admin@email.com}
app.admin.senha=${ADMIN_SENHA:admin123}

# ---------- Sessão ----------
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
