<!DOCTYPE html>
<!-- TELA 1: LOGIN (endereço: /criptografia.html) -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
    * { box-sizing: border-box; }

    :root {
        --roxo-950: #1a0b2e;
        --roxo-800: #2b1250;
        --roxo-700: #4a2678;
        --roxo-600: #5b3190;
        --roxo-500: #7b45c4;
        --roxo-400: #8f56e0;
        --texto-suave: #6b5a8c;
        accent-color: var(--roxo-500);
    }

    body {
        background:
            linear-gradient(115deg, transparent 38%, rgba(255,255,255,.05) 38%, rgba(255,255,255,.05) 70%, transparent 70%),
            linear-gradient(90deg, var(--roxo-950) 0, var(--roxo-400) 14px, var(--roxo-600) 70px,
                var(--roxo-600) calc(100% - 70px), var(--roxo-400) calc(100% - 14px), var(--roxo-950) 100%);
        background-attachment: fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
        color: var(--roxo-800);
    }

    .caixa {
        background: #fff;
        width: 400px;
        max-width: 100%;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(10,3,24,.55), 0 0 0 1px rgba(143,86,224,.35);
    }

    .logo {
        display: block;
        width: 60px;
        height: 60px;
        margin: 0 auto 16px;
        border: 2px solid var(--roxo-600);
        object-fit: cover;
    }

    h1 {
        margin: 0 0 14px;
        text-align: center;
        font-size: 28px;
        color: var(--roxo-800);
    }

    .subtitulo {
        margin: 0 0 32px;
        text-align: center;
        font-size: 14px;
        color: var(--texto-suave);
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 15px;
        font-weight: bold;
        color: var(--roxo-800);
    }

    input[type="email"],
    input[type="password"] {
        width: 100%;
        height: 42px;
        padding: 0 12px;
        margin-bottom: 20px;
        border: 1px solid #d6c9ee;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        font-size: 15px;
        color: var(--roxo-800);
    }

    input::placeholder { color: #8f80ad; }

    input[type="email"]:focus,
    input[type="password"]:focus {
        outline: none;
        border-color: var(--roxo-500);
        box-shadow: 0 0 0 3px rgba(123,69,196,.25);
    }

    .opcoes {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 4px 0 24px;
        font-size: 12px;
    }

    .opcoes label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 12px;
        font-weight: normal;
        color: var(--texto-suave);
        cursor: pointer;
    }

    .opcoes input { margin: 0 0 0 4px; }

    a {
        color: var(--roxo-500);
        text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    button {
        width: 100%;
        height: 43px;
        background: linear-gradient(135deg, var(--roxo-400), var(--roxo-600));
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: bold;
    }

    button:hover { background: linear-gradient(135deg, var(--roxo-500), var(--roxo-700)); }

    #mensagem {
        min-height: 20px;
        margin: 14px 0 0;
        text-align: center;
        font-size: 14px;
    }

    .criar-conta {
        margin: 18px 0 0;
        text-align: center;
        font-size: 13px;
        color: var(--texto-suave);
    }

    .criar-conta a { font-weight: bold; }
</style>
</head>
<body>
    <div class="caixa">
        <!-- Coloque a sua logo na mesma pasta com o nome logo.png -->
        <img class="logo" src="./imgs/whatfirestufftheyreadinginafrica.gif" alt="Logo da empresa">

        <h1>Login</h1>
        <p class="subtitulo">Entre na sua conta para continuar</p>

        <form id="formLogin">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>


            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem"></p>


    <script>
        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault(); // impede a página de recarregar

            // Envia email e senha NORMAIS: quem compara com o hash é o Java
            const dados = new URLSearchParams({
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            });

            const resposta = await fetch("/login", { method: "POST", body: dados });
            const texto = await resposta.text();
            const msg = document.getElementById("mensagem");

            if (resposta.ok) {
                // LOGIN CERTO: abre a tela 2
                window.location.href = "/home.html";
            } else {
                // LOGIN ERRADO: mostra a mensagem em vermelho
                msg.textContent = texto;
                msg.style.color = "red";
            }
        });
    </script>
</body>
</html>
