<!DOCTYPE html>
<!-- TELA 2: CRUD DE PRODUTOS (endereço: /produtos.html) -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="oculto">
    <main>
        <section class="painel">
            <div class="cabecalho-painel">
                <div>
                    <h2>Produtos</h2>
                    <p class="sub" style="margin:0">Cadastre, edite e exclua produtos e controle o estoque.</p>
                </div>
                <button type="button" class="btn" id="btnNovo">+ Novo produto</button>
            </div>

            <div class="busca" style="margin-bottom:16px">
                <input type="search" id="campoBusca" placeholder="Consultar por nome ou categoria..." autocomplete="off">
            </div>

            <p class="estado" id="estado">Carregando produtos...</p>
            <div class="tabela-rolagem" id="areaTabela" hidden>
                <table>
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th class="num">Preço</th>
                            <th class="num">Estoque</th>
                            <th>Descrição</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="corpo"></tbody>
                </table>
            </div>
        </section>
    </main>

    <dialog id="janela">
        <h2 id="tituloJanela">Novo produto</h2>
        <p class="sub">Preencha os dados do produto</p>

        <form id="form" novalidate>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite o nome do produto" maxlength="120" required>

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" placeholder="Ex.: Periféricos" maxlength="80">

            <div class="linha">
                <div>
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" name="preco" placeholder="0,00" min="0" step="0.01" required>
                </div>
                <div>
                    <label for="estoque">Estoque</label>
                    <input type="number" id="estoque" name="estoque" placeholder="0" min="0" step="1" required>
                </div>
            </div>

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" placeholder="Opcional" maxlength="500"></textarea>

            <div class="rodape-janela">
                <button type="button" class="btn claro" id="btnFechar">Cancelar</button>
                <button type="submit" class="btn" id="btnSalvar">Salvar</button>
            </div>
        </form>
    </dialog>

    <script src="/js/app.js"></script>
    <script>
        const janela = document.getElementById("janela");
        const form = document.getElementById("form");
        const corpo = document.getElementById("corpo");
        const estado = document.getElementById("estado");
        const area = document.getElementById("areaTabela");
        const busca = document.getElementById("campoBusca");
        const botaoSalvar = document.getElementById("btnSalvar");
        let produtos = [];
        let editandoId = null;

        /* ---------- LISTAR (GET) ---------- */
        async function carregar() {
            try {
                produtos = await api("/api/produtos?busca=" + encodeURIComponent(busca.value.trim()));
                desenhar();
            } catch (e) {
                estado.textContent = "Não foi possível carregar os produtos.";
                estado.hidden = false;
                area.hidden = true;
                toast(e.message, "erro");
            }
        }

        function desenhar() {
            corpo.innerHTML = "";
            if (produtos.length === 0) {
                estado.textContent = busca.value.trim()
                    ? 'Nenhum produto encontrado para "' + busca.value.trim() + '".'
                    : "Nenhum produto cadastrado ainda. Clique em \"Novo produto\".";
                estado.hidden = false;
                area.hidden = true;
                return;
            }
            for (const p of produtos) {
                const linha = document.createElement("tr");
                linha.innerHTML = `
                    <td>${esc(p.nome)}</td>
                    <td>${esc(p.categoria)}</td>
                    <td class="num">${moeda.format(p.preco)}</td>
                    <td class="num ${p.estoque <= 5 ? "baixo" : ""}" title="${p.estoque <= 5 ? "Estoque baixo" : ""}">${p.estoque}</td>
                    <td>${esc(p.descricao)}</td>
                    <td class="acoes">
                        <button type="button" class="btn mini" data-acao="editar" data-id="${p.id}">Editar</button>
                        <button type="button" class="btn mini perigo" data-acao="excluir" data-id="${p.id}">Excluir</button>
                    </td>`;
                corpo.appendChild(linha);
            }
            estado.hidden = true;
            area.hidden = false;
        }

        let temporizador;
        busca.addEventListener("input", () => { clearTimeout(temporizador); temporizador = setTimeout(carregar, 250); });

        /* ---------- Janela de cadastro / edição ---------- */
        function abrirJanela(produto) {
            editandoId = produto ? produto.id : null;
            form.reset();
            limparErrosCampos(form);
            document.getElementById("tituloJanela").textContent = produto ? "Editar produto" : "Novo produto";
            if (produto) {
                for (const campo of ["nome", "categoria", "preco", "estoque", "descricao"]) {
                    form.elements[campo].value = produto[campo] ?? "";
                }
            }
            janela.showModal();
            form.elements.nome.focus();
        }

        document.getElementById("btnNovo").addEventListener("click", () => abrirJanela(null));
        document.getElementById("btnFechar").addEventListener("click", () => janela.close());

        /* ---------- CADASTRAR (POST) e EDITAR (PUT) ---------- */
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            limparErrosCampos(form);

            const preco = form.elements.preco.value;
            const estoque = form.elements.estoque.value;
            const dados = {
                nome: form.elements.nome.value.trim(),
                categoria: form.elements.categoria.value.trim(),
                preco: preco === "" ? null : Number(preco),
                estoque: estoque === "" ? null : Number(estoque),
                descricao: form.elements.descricao.value.trim()
            };

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = "Salvando...";
            try {
                if (editandoId) {
                    await api("/api/produtos/" + editandoId, { method: "PUT", body: dados });
                    toast("Produto atualizado com sucesso!", "sucesso");
                } else {
                    await api("/api/produtos", { method: "POST", body: dados });
                    toast("Produto cadastrado com sucesso!", "sucesso");
                }
                janela.close();
                carregar();
            } catch (erro) {
                mostrarErrosCampos(form, erro.campos);
                toast(erro.message, "erro");
            } finally {
                botaoSalvar.disabled = false;
                botaoSalvar.textContent = "Salvar";
            }
        });

        /* ---------- EDITAR / EXCLUIR (DELETE) pelos botões da tabela ---------- */
        corpo.addEventListener("click", async (e) => {
            const botao = e.target.closest("button[data-acao]");
            if (!botao) return;
            const produto = produtos.find((p) => String(p.id) === botao.dataset.id);
            if (!produto) return;

            if (botao.dataset.acao === "editar") {
                abrirJanela(produto);
            } else {
                const ok = await confirmar('Deseja realmente excluir o produto "' + produto.nome + '"? Esta ação não pode ser desfeita.',
                    { titulo: "Excluir produto" });
                if (!ok) return;
                try {
                    await api("/api/produtos/" + produto.id, { method: "DELETE" });
                    toast("Produto excluído com sucesso.", "sucesso");
                    carregar();
                } catch (erro) {
                    toast(erro.message, "erro");
                    carregar();
                }
            }
        });

        (async () => {
            if (await iniciarPagina("produtos")) carregar();
        })();
    </script>
</body>
</html>
