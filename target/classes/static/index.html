<!DOCTYPE html>
<!-- LOGIN (endereço: /  ou  /index.html) -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="centro">
    <div class="caixa">
        <img class="logo" src="/imgs/purple-purplecore.webp" alt="Logo">
        <h1>Login</h1>
        <p class="subtitulo">Entre na sua conta para continuar</p>

        <form id="formLogin">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required autocomplete="username">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password">

            <button type="submit" class="btn" id="btnEntrar">Entrar</button>
        </form>

        <p class="rodape">Ainda não possui uma conta? <a href="/cadastro.html">Criar conta</a></p>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const form = document.getElementById("formLogin");
        const botao = document.getElementById("btnEntrar");

        // Se já estiver logado, vai direto para o início
        api("/api/auth/me", { semRedirecionar: true }).then(() => { location.href = "/home.html"; }).catch(() => {});

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            botao.disabled = true;
            botao.textContent = "Entrando...";
            try {
                await api("/api/auth/login", {
                    method: "POST",
                    semRedirecionar: true,
                    body: {
                        email: document.getElementById("email").value,
                        senha: document.getElementById("senha").value
                    }
                });
                location.href = "/home.html";
            } catch (erro) {
                toast(erro.message, "erro");
                botao.disabled = false;
                botao.textContent = "Entrar";
            }
        });
    </script>
</body>
</html>
