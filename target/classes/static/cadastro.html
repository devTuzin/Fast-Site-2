<!DOCTYPE html>
<!-- TELA DE CADASTRO (endereço: /cadastro.html) -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro</title>
    <style>
        * { box-sizing: border-box; }

        body {
            background: #4b4d50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            color: #0a1f44;
        }

        .caixa {
            background: #fff;
            width: 440px;
            max-width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
        }

        .logo {
            display: block;
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border: 2px solid #0a1f44;
            object-fit: cover;
        }

        h1 {
            margin: 0 0 14px;
            text-align: center;
            font-size: 28px;
        }

        .subtitulo {
            margin: 0 0 28px;
            text-align: center;
            font-size: 14px;
            color: #4b5b7a;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 0 12px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            color: #111827;
        }

        input { height: 42px; }

        textarea {
            height: 90px;
            padding: 10px 12px;
            resize: vertical;
        }

        input::placeholder, textarea::placeholder { color: #6b7280; }

        input:focus, textarea:focus {
            outline: none;
            border-color: #2f5de8;
            box-shadow: 0 0 0 3px rgba(47, 93, 232, .2);
        }

        /* CEP e Número lado a lado */
        .linha {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            width: 100%;
            height: 43px;
            margin-top: 6px;
            background: #2f5de8;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover { background: #2450cf; }
        button:disabled { background: #93a8ee; cursor: not-allowed; }

        #mensagem {
            min-height: 20px;
            margin: 14px 0 0;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .voltar {
            margin: 18px 0 0;
            text-align: center;
            font-size: 13px;
            color: #4b5b7a;
        }

        .voltar a {
            color: #2f5de8;
            font-weight: bold;
            text-decoration: none;
        }

        .voltar a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="caixa">
        <img class="logo" src="logo.png" alt="Logo da empresa">

        <h1>Cadastro</h1>
        <p class="subtitulo">Preencha os dados para criar sua conta</p>

        <form id="formCadastro">
            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" placeholder="Digite seu endereço" required>

            <div class="linha">
                <div>
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" placeholder="00000-000" inputmode="numeric"
                           maxlength="9" pattern="\d{5}-\d{3}" title="Digite o CEP no formato 00000-000" required>
                </div>
                <div>
                    <label for="numero">Número</label>
                    <input type="text" id="numero" placeholder="Ex.: 123" required>
                </div>
            </div>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" inputmode="numeric"
                   maxlength="15" pattern="\(\d{2}\) \d{4,5}-\d{4}"
                   title="Digite o telefone com DDD, ex.: (11) 91234-5678" required>

            <label for="observacao">Observação</label>
            <textarea id="observacao" placeholder="Digite sua observação" required></textarea>

            <button type="submit" id="btnCadastrar">Cadastrar</button>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <p class="voltar">Já possui uma conta? <a href="criptografia.html">Entrar</a></p>
    </div>

    <script>
        const form = document.getElementById("formCadastro");
        const msg = document.getElementById("mensagem");
        const botao = document.getElementById("btnCadastrar");

        // Máscara do CEP: 00000-000
        document.getElementById("cep").addEventListener("input", (e) => {
            let v = e.target.value.replace(/\D/g, "").slice(0, 8);
            if (v.length > 5) v = v.slice(0, 5) + "-" + v.slice(5);
            e.target.value = v;
        });

        // Máscara do telefone: (00) 00000-0000 ou (00) 0000-0000
        document.getElementById("telefone").addEventListener("input", (e) => {
            let v = e.target.value.replace(/\D/g, "").slice(0, 11);
            if (v.length > 10) {
                v = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
            } else if (v.length > 6) {
                v = `(${v.slice(0, 2)}) ${v.slice(2, 6)}-${v.slice(6)}`;
            } else if (v.length > 2) {
                v = `(${v.slice(0, 2)}) ${v.slice(2)}`;
            } else if (v.length > 0) {
                v = `(${v}`;
            }
            e.target.value = v;
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            msg.textContent = "";
            botao.disabled = true;
            botao.textContent = "Cadastrando...";

            const dados = new URLSearchParams({
                nome: document.getElementById("nome").value.trim(),
                endereco: document.getElementById("endereco").value.trim(),
                cep: document.getElementById("cep").value,
                numero: document.getElementById("numero").value.trim(),
                telefone: document.getElementById("telefone").value,
                observacao: document.getElementById("observacao").value.trim()
            });

            try {
                const resposta = await fetch("/cadastro", { 
                    method: "POST", 
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: dados 
                });
                
                const texto = await resposta.text();

                if (resposta.ok) {
                    msg.textContent = "Cadastro realizado com sucesso!";
                    msg.style.color = "#15803d";
                    form.reset();
                } else {
                    msg.textContent = texto || "Não foi possível realizar o cadastro.";
                    msg.style.color = "red";
                }
            } catch (erro) {
                msg.textContent = "Erro de conexão com o servidor. Tente novamente.";
                msg.style.color = "red";
            } finally {
                botao.disabled = false;
                botao.textContent = "Cadastrar";
            }
        });
    </script>
</body>
</html>
